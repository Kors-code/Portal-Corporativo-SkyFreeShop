services:
  postgres:
    image: postgres:16-alpine
    container_name: skyfree-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: skyfree
      POSTGRES_PASSWORD: skyfree_dev_password
      POSTGRES_DB: skyfree
    ports:
      - "5433:5432"
    volumes:
      - skyfree_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyfree -d skyfree"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  skyfree_postgres_data:
